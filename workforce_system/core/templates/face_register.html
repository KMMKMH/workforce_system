{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Face Registration</title>
    <link rel="stylesheet" href="{% if request.COOKIES.workforceTheme == 'light' %}{% static 'themes/light/face_light.css' %}{% else %}{% static 'themes/dark/face.css' %}{% endif %}" data-theme-link data-dark-theme="{% static 'themes/dark/face.css' %}" data-light-theme="{% static 'themes/light/face_light.css' %}">
    {% include "components/theme_bootstrap.html" %}
</head>
<body>

<div class="container">
    <h2>Face Registration</h2>
    <p>We'll take a first look at your face, then guide you through a quick liveness check to confirm you're a real person.</p>

    <video id="video" autoplay></video>

    <button onclick="startRegistration()">Start Registration</button>

    <canvas id="canvas" style="display:none;"></canvas>

    <p id="status" class="status"></p>
</div>

<script src="{% static 'theme_switcher.js' %}"></script>
<script src="{% static 'face_register.js' %}"></script>

</body>
</html>
