{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Changed | Workforce System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% if request.COOKIES.workforceTheme == 'light' %}{% static 'themes/light/password_change_done_light.css' %}{% else %}{% static 'themes/dark/password_change_done.css' %}{% endif %}" data-theme-link data-dark-theme="{% static 'themes/dark/password_change_done.css' %}" data-light-theme="{% static 'themes/light/password_change_done_light.css' %}">
    {% include "components/theme_bootstrap.html" %}
</head>
<body>
<div class="done-container">
    <div class="back-nav">
        <a href="{% url 'profile' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Profile
        </a>
    </div>

    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>Password Changed</h1>
        <p>Your password was updated successfully.</p>
        <div class="action-buttons">
            <a href="{% url 'dashboard' %}" class="btn primary">
                <i class="fas fa-home"></i> Go to Dashboard
            </a>
        </div>
    </div>
</div>
<script src="{% static 'theme_switcher.js' %}"></script>
</body>
</html>
