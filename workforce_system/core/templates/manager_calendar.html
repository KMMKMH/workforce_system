{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Calendar | Workforce System</title>
    <script src="{% static 'vendor/fullcalendar/index.global.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% if request.COOKIES.workforceTheme == 'light' %}{% static 'themes/light/manager_calendar_light.css' %}{% else %}{% static 'themes/dark/manager_calendar.css' %}{% endif %}" data-theme-link data-dark-theme="{% static 'themes/dark/manager_calendar.css' %}" data-light-theme="{% static 'themes/light/manager_calendar_light.css' %}">
    {% include "components/theme_bootstrap.html" %}
</head>
<body>
<div class="calendar-wrapper">
    <div class="calendar-header">
        <h2><i class="fas fa-calendar-alt"></i> Team Calendar</h2>
        <a href="{% url 'manager_dashboard' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Team Dashboard
        </a>
    </div>
    <div id="calendar"></div>
    <div class="data">{{ events_json|safe }}</div>
</div>
<script src="{% static 'theme_switcher.js' %}"></script>
<script src="{% static 'manager_calendar.js' %}"></script>
</body>
</html>
